bias_field:
  convergence_threshold: 0.0001
  enabled: false
  iterations: 50
  method: n4itk
clahe:
  clip_limit: 2.0
  enabled: true
  tile_grid:
  - 8
  - 8
denoise:
  h: 10.0
  method: nlm
  search_window: 21
  sigma: 1.0
  sigma_color: 75.0
  sigma_space: 75.0
  template_window: 7
normalize:
  dtype: uint8
  high_percentile: 99.5
  low_percentile: 0.5
  method: minmax
  target_range:
  - 0
  - 255
registration:
  enabled: false
  interpolation: linear
  method: rigid
  target_atlas: null
slice_axis: 2
slice_range: null
